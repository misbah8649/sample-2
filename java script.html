<html>
<head>
<title>JAVASCRIPT DEMO PAGE</title>
</head>
<body>
<h2>Internal Scripting</h2>
<br/>
<br/>
<label>A=</label><input type="text" placeholder="enter a value" id="text1"><br/>
<label>B=</label><input type="text" placeholder="enter a value" id="text2">
<p id="demo1"></p>
<button type="submit" onclick="fun1()">CLICK ME</button>

<script>
function fun1()
{
var a=document.getElementById('text1').value;
let b=document.getElementById('text2').value;
var c=parseInt(a)+parseInt(b);
document.getElementById('demo1').innerHTML='Addition of a and b is '+c;
}
</script>

</body>
</html>
