<html>
<head>
<title>CALCULATOR GENERATOR</title>
<style>
  .body {
    background-color:lightblue;
    color:lightblue;
    text-align: center;
    margin-top: 50px;
  }

  .container {
    display: inline-block;
    background:white;
    padding: 20px;
    border-radius: 10px;
  }

  #calc {
    width: 220px;
    height: 40px;
    font-size: 20px;
    text-align: right;
    margin-bottom: 10px;
    padding: 5px;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 55px);
    gap: 5px;
  }

  .button {
    height: 40px;
    font-size: 18px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  .operator {
     background:lightblue; 
     color: black;
  }

  .calculate {
     background:lightblue;
     color:black; 
  }

</style>
</head>
<body>
<h2>Calculate Generator</h2>

<div class="container">
  <input type="text" id="calc" value="0"/>
  <div class="buttons">
    <button onclick="clearDisplay()">C</button>
    <button onclick="deleteLast()">Back</button>
    <button class="operator" onclick="appendValue('%')">%</button>
    <button class="operator" onclick="appendValue('/')">/</button>

    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button class="operator" onclick="appendValue('+')">+</button>

    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button class="operator" onclick="appendValue('-')">-</button>

    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button class="operator" onclick="appendValue('*')">*</button>

    <button onclick="appendValue('0')">0</button>
    <button onclick="appendValue('.')">.</button>
    <button class="calculate" onclick="calculateAll()">=</button>
  </div>
</div>

<script>
const display = document.getElementById("calc");

function clearDisplay() {
  display.value = "0";
}

function deleteLast()
{
if(display.value.length===1)
{
display.value="0";
}
else
{
display.value=display.value.slice(0,-1);
}
}

function appendValue(val) {
  if (display.value === "0" && !isNaN(val)) {
    display.value = val;
  } else {
    display.value += val;
  }
}

function calculateAll() {
  try {
    display.value = eval(display.value);
  } catch (error) {
    display.value = "Error";
  }
}
</script>
</body>
</html>
